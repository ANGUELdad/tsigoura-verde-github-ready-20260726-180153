<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Tsigoura Verde Resort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   TSIGOURA VERDE — guest menu
   Palette locked to the logo: teal-green #223539 + gold #B89858.
   Features: animated first-visit splash + language picker, brand hero photo,
   icon category nav, scroll animations, persistent cart (survives refresh),
   guarded send-to-kitchen, full anti-spam/abuse, printed-menu closing info.
   ========================================================================== */
:root{
  --paper:#F5F0E3; --card:#FFFDF8; --pine:#223539; --pine-2:#17272B;
  --olive:#38564F; --gold:#A07E3C; --gold-lt:#D3BA82; --terra:#B4623A;
  --ink:#26231B; --muted:#8B8674; --faint:#B4AE9B; --line:#E3DBC7; --line-2:#EEE8D8;
  --maxw:600px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:auto;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:
  radial-gradient(circle at 12% 8%,rgba(184,98,58,.11),transparent 24%),
  radial-gradient(circle at 86% 16%,rgba(160,126,60,.13),transparent 26%),
  linear-gradient(180deg,#F5F0E3 0%,#FFFDF8 45%,#ECE6D4 100%);}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.28;
  background-image:linear-gradient(90deg,rgba(34,53,57,.05) 1px,transparent 1px),
    linear-gradient(180deg,rgba(34,53,57,.04) 1px,transparent 1px);
  background-size:34px 34px;mask-image:linear-gradient(180deg,transparent,#000 14%,#000 82%,transparent);}
body.traditional-mode .cart,body.traditional-mode .carticon,body.traditional-mode .help,body.traditional-mode .panel{display:none!important;}
body.no-visual-rail .visual-rail{display:none!important;}
.sec-h .cat-art{display:none!important;}
.sec-h{padding-right:16px!important;}
body.motion-off *,body.motion-soft *{animation:none!important;}
body.motion-soft .hero .bg,body.motion-soft .vshot img{animation:kenburns 28s ease-in-out infinite alternate!important;}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}
input{font-family:inherit;}
img{display:block;}
.greek-ic{display:block;width:1.35em;height:1.35em;background:var(--food) center/contain no-repeat;
  filter:drop-shadow(0 2px 2px rgba(23,39,43,.12));}
.wrap{max-width:var(--maxw);width:100%;margin:0 auto;padding-bottom:120px;overflow-x:hidden;overflow-y:visible;}
body.traditional-mode .wrap{padding-bottom:44px;}

/* ═════════ SPLASH (first visit) ═════════ */
.splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#2C4A4F 0%,#1D3438 55%,#142A2E 100%);color:#F3ECD6;
  transition:opacity .5s ease, transform .5s ease;}
.splash.gone{opacity:0;transform:scale(1.04);pointer-events:none;}
.sp-inner{text-align:center;padding:30px;max-width:420px;width:100%;}
.sp-mark{width:110px;height:110px;margin:0 auto 22px;object-fit:contain;
  opacity:0;transform:scale(.6) translateY(10px);animation:spMark .9s cubic-bezier(.2,.8,.2,1) .15s forwards;}
@keyframes spMark{to{opacity:1;transform:none;}}
.sp-name{font-family:Fraunces,serif;font-size:14px;letter-spacing:3px;color:rgba(243,236,214,.62);
  margin-bottom:16px;opacity:0;animation:spFade .6s ease .4s forwards;}
.sp-name b{color:var(--gold-lt);font-weight:700;letter-spacing:4px;}
.sp-name i{font-style:italic;letter-spacing:2px;color:rgba(243,236,214,.8);}
.sp-word{font-family:Fraunces,serif;font-size:32px;color:#F7F0DA;min-height:42px;
  opacity:0;animation:spFade .6s ease .55s forwards;}
.sp-word span{display:inline-block;transition:opacity .35s ease, transform .35s ease;}
.sp-sub{font-size:12.5px;color:rgba(243,236,214,.6);margin:22px 0 14px;letter-spacing:.3px;
  opacity:0;animation:spFade .6s ease .9s forwards;transition:opacity .3s ease;}
@keyframes spFade{to{opacity:1;}}
.sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:340px;margin:0 auto;}
.sp-lang{display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(211,186,130,.28);color:#F3ECD6;font-size:15px;font-weight:500;
  opacity:0;transform:translateY(10px);animation:spBtn .5s cubic-bezier(.2,.8,.2,1) forwards;}
.sp-lang .fl{font-size:20px;}
.sp-lang:active{transform:scale(.96);}
.sp-lang:hover{background:rgba(211,186,130,.16);}
.sp-lang.lit{background:rgba(211,186,130,.20);border-color:var(--gold-lt);
  box-shadow:0 0 0 1px rgba(211,186,130,.35),0 6px 18px rgba(0,0,0,.18);}
.sp-mark{animation:spMark .9s cubic-bezier(.2,.8,.2,1) .15s forwards, float 5s ease-in-out 1.2s infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

/* app-wide motion polish */
.head .mark{animation:markIn .7s cubic-bezier(.2,.8,.2,1) both;}
@keyframes markIn{from{opacity:0;transform:scale(.7) rotate(-8deg);}to{opacity:1;transform:none;}}
.hero{animation:heroIn .7s cubic-bezier(.2,.8,.2,1) both;}
@keyframes heroIn{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}
.sec-h{animation:slideIn .5s cubic-bezier(.2,.8,.2,1) both;}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:none;}}
.tab{transition:background .18s,color .18s,transform .14s,border-color .18s;}
.tab:active{transform:scale(.94);}
.add-sm,.add,.cta,.info-b,.cpy,.step button{transition:transform .14s ease,background .18s ease,color .18s ease;}
.sheet .grip{transition:background .2s;}
.crow{animation:rowIn .4s ease both;}
@keyframes rowIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.toast{will-change:transform;}
@keyframes spBtn{to{opacity:1;transform:none;}}

/* ═════════ header ═════════ */
.head{--brand-2line:1;padding:26px 26px 14px;display:flex;align-items:center;gap:13px;}
.head .brand{min-width:0;}
@media(max-width:470px){
  .head .brand h1{font-size:18px;line-height:1.12;letter-spacing:0;}
  .head .brand .sub{display:none;}
}
.mark-link{width:46px;height:46px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0;border-radius:50%;text-decoration:none;touch-action:manipulation;}
.head .mark{width:46px;height:46px;object-fit:contain;}
.mark-link:active{transform:scale(.96);}
.head .brand h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(19px,6.1vw,28px);line-height:1.06;color:var(--pine);margin:0;letter-spacing:-.3px;overflow-wrap:break-word;}
.head .brand .sub{font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:8px;}
.head .brand .sub::before{content:'';width:16px;height:1.5px;background:var(--gold);display:inline-block;}
.carticon{margin-left:auto;flex:0 0 auto;position:relative;width:40px;height:40px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--pine);}
.carticon svg{width:19px;height:19px;}
.carticon:active{transform:scale(.94);}
.carticon.bump{animation:cbump .4s ease;}
@keyframes cbump{40%{transform:scale(1.18);}}
.carticon .cbadge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--gold);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1;}
.carticon.has .cbadge{display:flex;}
.wifibtn{margin-left:auto;flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--card);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--pine);}
.wifibtn svg{width:19px;height:19px;}
.wifibtn:active{transform:scale(.94);}
.carticon{margin-left:8px;}
.langbtn{flex:0 0 auto;font-size:12px;font-weight:600;letter-spacing:.4px;
  color:var(--pine);border:1px solid var(--line);border-radius:20px;padding:8px 13px;background:var(--card);}
.langbtn:active{transform:scale(.96);}

/* info button per dish */
.info-b{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1.3px solid var(--line);color:var(--muted);
  font-family:Fraunces,serif;font-style:italic;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-left:auto;}
.info-b:active{transform:scale(.88);}
.item .meta.hasinfo{gap:10px;}

/* warnbox / info sheet */
.warnbox{margin-top:16px;background:#FBEEDD;border:1px solid #E9C79A;color:#7A4A16;border-radius:12px;padding:13px 15px;font-size:12.5px;line-height:1.55;}
.info-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:14px;}
.info-row .k{color:var(--muted);min-width:96px;}
.info-chips{display:flex;flex-wrap:wrap;gap:6px;}
.ichip{font-size:11.5px;color:var(--pine);background:var(--line-2);border-radius:8px;padding:4px 9px;}

/* wifi / order QR */
.qrwrap{display:flex;justify-content:center;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:6px auto;width:max-content;}
.qrwrap svg{display:block;border-radius:8px;}
.wifiscan{text-align:center;font-size:12.5px;color:var(--muted);margin:8px 0 16px;}
.wrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:14px;}
.wrow span{color:var(--muted);min-width:90px;}
.wrow b{font-family:Fraunces,serif;font-size:16px;color:var(--pine);}
.cpy{margin-left:auto;font-size:12px;font-weight:600;color:var(--olive);border:1px solid var(--line);border-radius:12px;padding:7px 12px;background:var(--card);}
.cpy:active{transform:scale(.95);}
.okmark{width:52px;height:52px;border-radius:50%;background:var(--olive);color:#fff;font-size:28px;
  display:flex;align-items:center;justify-content:center;margin:6px auto 8px;animation:pop .4s cubic-bezier(.2,.9,.3,1.4);}
@keyframes pop{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
.ordno{font-size:13px;color:var(--muted);text-align:center;margin:2px 0 10px;}
.ordno b{font-family:Fraunces,serif;font-size:20px;color:var(--pine);letter-spacing:1px;}
.ordline{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line-2);}

/* smart order QR handoff: guest-safe view first, waiter/admin redirect when trusted */
.handoff-page{min-height:100vh;padding:22px;display:flex;align-items:center;justify-content:center;
  background:
    linear-gradient(160deg,rgba(245,240,227,.92),rgba(255,253,248,.96)),
    url('media/hero.jpg') center/cover fixed;color:var(--ink);}
.handoff-card{position:relative;width:100%;max-width:520px;border:1px solid rgba(211,186,130,.45);
  border-radius:20px;background:rgba(255,253,248,.94);box-shadow:0 24px 70px rgba(23,39,43,.24);
  overflow:hidden;animation:handoffIn .55s cubic-bezier(.2,.8,.2,1) both;}
.handoff-card::before{content:'';position:absolute;inset:0 0 auto;height:5px;
  background:linear-gradient(90deg,var(--pine),var(--gold),var(--terra),var(--olive));}
.handoff-top{padding:22px 22px 16px;background:linear-gradient(135deg,#223539,#38564F);color:#F7F0DA;}
.handoff-mark{width:54px;height:54px;object-fit:contain;margin-bottom:12px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.2));}
.handoff-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;color:var(--pine);background:var(--gold-lt);border-radius:18px;padding:5px 10px;}
.handoff-card h1{font-family:Fraunces,serif;font-size:28px;line-height:1.05;font-weight:600;margin:12px 0 7px;letter-spacing:0;}
.handoff-sub{font-size:13px;line-height:1.5;color:rgba(247,240,218,.78);margin:0;}
.handoff-body{padding:18px 22px 22px;}
.handoff-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.handoff-pill{border:1px solid var(--line);border-radius:12px;background:#FBF7EA;padding:10px 12px;}
.handoff-pill span{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);}
.handoff-pill b{display:block;font-family:Fraunces,serif;font-size:18px;color:var(--pine);margin-top:3px;}
.handoff-lines{border:1px solid var(--line);border-radius:15px;background:var(--card);overflow:hidden;margin-top:12px;}
.handoff-line{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 13px;border-bottom:1px solid var(--line-2);
  animation:rowIn .35s ease both;}
.handoff-line:last-child{border-bottom:none;}
.handoff-qty{min-width:30px;font-family:Fraunces,serif;font-size:18px;font-weight:700;color:var(--gold);}
.handoff-name{font-family:Fraunces,serif;font-size:16px;color:var(--ink);line-height:1.18;}
.handoff-extra{font-size:11.5px;line-height:1.35;margin-top:4px;color:var(--muted);}
.handoff-extra .no{color:var(--terra);}
.handoff-price{font-family:Fraunces,serif;font-size:16px;color:var(--pine);white-space:nowrap;}
.handoff-total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 16px;
  font-family:Fraunces,serif;font-weight:700;font-size:23px;color:var(--pine);}
.handoff-total span:last-child{color:var(--gold);}
.handoff-waiter{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:13px;
  border:1px dashed rgba(56,86,79,.38);border-radius:15px;background:rgba(56,86,79,.07);padding:12px;}
.handoff-waiter .qrwrap{margin:0;background:#FFFDF8;}
.handoff-waiter p{font-size:12.5px;line-height:1.45;color:#46544D;margin:0;}
.handoff-status,.waiter-status{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:11px 13px;border-radius:14px;background:#EEF5EF;border:1px solid rgba(56,86,79,.22);color:#38564F;text-align:left;font-size:12.5px;line-height:1.45;}
.handoff-status b,.waiter-status b{display:block;color:#223539;font-size:13px;margin-bottom:2px;}
.handoff-status i,.waiter-status i{width:9px;height:9px;border-radius:50%;background:var(--gold);margin-top:5px;box-shadow:0 0 0 0 rgba(184,152,88,.55);animation:statusPulse 1.8s ease-in-out infinite;flex:0 0 auto;}
.handoff-status.sent i,.waiter-status.sent i{background:var(--olive);}
@keyframes statusPulse{50%{box-shadow:0 0 0 6px rgba(184,152,88,0);}}
.handoff-actions{display:flex;gap:10px;margin-top:16px;}
.handoff-btn{flex:1;display:flex;justify-content:center;align-items:center;min-height:46px;border-radius:13px;
  font-size:13px;font-weight:800;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--pine);}
.handoff-btn.primary{background:var(--pine);border-color:var(--pine);color:#F7F0DA;}
.handoff-btn:active{transform:scale(.97);}
.handoff-error{font-size:13.5px;line-height:1.55;color:var(--terra);background:#FBEAE2;border:1px solid #E7C3B2;border-radius:13px;padding:13px;}
@keyframes handoffIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
@media(max-width:460px){
  .handoff-page{padding:14px;}
  .handoff-card h1{font-size:25px;}
  .handoff-meta{grid-template-columns:1fr;}
  .handoff-waiter{grid-template-columns:1fr;text-align:center;}
  .handoff-waiter .qrwrap{margin:0 auto;}
  .handoff-actions{flex-direction:column;}
  .visual-rail{height:104px;grid-template-columns:1fr 1fr;}
  .vshot b{font-size:13.5px;}
  .quick-flow{grid-template-columns:1fr 1fr;gap:8px;}
  .flow-chip:nth-child(5){grid-column:1 / -1;}
  .book-two,.social-grid{grid-template-columns:1fr;}
  .cat-mosaic{grid-template-columns:1fr 1fr;gap:8px;}
  .cat-card{min-height:86px;padding:12px;}
  .cat-card:first-child{grid-row:auto;min-height:110px;grid-column:1 / -1;}
  .cat-card b{font-size:17px;}
  .cat-card:first-child b{font-size:22px;}
  .cat-card .art{width:56px;height:56px;}
  .cat-card .art img{max-width:52px;max-height:52px;}
  .cat-card:first-child .art{width:82px;height:82px;}
  .cat-card:first-child .art img{max-width:78px;max-height:78px;}
  .sec-h{grid-template-columns:44px minmax(0,1fr);min-height:94px;padding:14px 86px 14px 14px;gap:10px;}
  .sec-h .cat-art{width:72px;height:72px;border-radius:18px;}
  .sec-h .cat-art img{width:56px;height:56px;}
  .sec-h .sic{width:44px;height:44px;border-radius:13px;}
  .sec-h .t{font-size:22px;}
}
/* night history */
.histcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;animation:rowIn .4s ease both;}
.histcard .hh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
.histcard .hh b{font-family:Fraunces,serif;font-size:14px;color:var(--gold);letter-spacing:.5px;}
.histcard .hh span{font-size:11.5px;color:var(--muted);}
.histcard .hh .ht{margin-left:auto;font-family:Fraunces,serif;font-size:15px;color:var(--pine);font-weight:600;}
.histcard .ordline:last-child{border-bottom:none;}

/* cookie banner */
.cookie{position:fixed;left:12px;right:12px;bottom:12px;max-width:var(--maxw);margin:0 auto;z-index:90;
  background:var(--pine);color:#F3ECD6;border-radius:16px;padding:15px 17px;box-shadow:0 14px 34px rgba(20,40,42,.4);
  transform:translateY(160%);transition:transform .4s cubic-bezier(.2,.8,.2,1);}
.cookie.on{transform:none;}
.cookie .ck-t{font-family:Fraunces,serif;font-size:16px;margin-bottom:5px;}
.cookie .ck-x{font-size:12px;line-height:1.5;color:rgba(243,236,214,.82);}
.cookie .ck-row{display:flex;gap:9px;margin-top:12px;}
.cookie .ck-more{flex:1;font-size:13px;font-weight:600;color:#F3ECD6;border:1px solid rgba(211,186,130,.4);border-radius:11px;padding:10px;}
.cookie .ck-ok{flex:1;font-size:13px;font-weight:700;background:var(--gold-lt);color:var(--pine-2);border-radius:11px;padding:10px;}

/* ═════════ hero ═════════ */
.hero{margin:12px 22px 8px;border-radius:22px;overflow:hidden;position:relative;
  background:linear-gradient(158deg,#2C4A4F 0%,#1D3438 60%,#152A2E 100%);color:#F3ECD6;
  padding:22px 22px 20px;box-shadow:0 16px 40px rgba(20,40,42,.30);}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02);}
.hero .ov{position:absolute;inset:0;background:linear-gradient(158deg,rgba(34,53,57,.72) 0%,rgba(24,40,44,.9) 62%,rgba(18,32,35,.96) 100%);}
.hero .hatch{position:absolute;inset:0;pointer-events:none;opacity:.6;}
.hero::after{content:'';position:absolute;left:-25%;right:-25%;bottom:-46%;height:82%;
  background:radial-gradient(ellipse at center,rgba(211,186,130,.26),transparent 62%);
  animation:heroGlow 7s ease-in-out infinite alternate;pointer-events:none;}
.hero .kick{position:relative;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-lt);font-weight:600;display:flex;align-items:center;gap:8px;}
.hero .kick::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(211,186,130,.5),transparent);}
.hero h2{position:relative;font-family:Fraunces,serif;font-weight:600;font-size:27px;line-height:1.06;color:#F7F0DA;margin:12px 0 6px;display:flex;align-items:flex-start;gap:11px;min-width:0;overflow-wrap:anywhere;}
.hero h2 .hic{flex:0 0 auto;display:inline-flex;}
.hero h2 .hic .ic{width:24px;height:24px;color:var(--gold-lt);}
.hero h2 .hic .greek-ic{width:32px;height:32px;}
.hero p{position:relative;font-size:13px;line-height:1.5;color:rgba(243,236,214,.72);margin:0 0 16px;max-width:90%;}
.hero .row{position:relative;display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap;}
.hero .pr{font-family:Fraunces,serif;font-weight:600;font-size:23px;color:var(--gold-lt);}
.hero .pr .u{font-family:Inter,sans-serif;font-size:11px;font-weight:500;color:rgba(211,186,130,.7);margin-left:2px;}
.hero .add{margin-left:auto;background:var(--gold-lt);color:var(--pine-2);font-weight:600;
  border-radius:13px;padding:11px 18px;font-size:14px;letter-spacing:.2px;}
.hero .add:active{transform:scale(.95);}

.visual-rail{margin:14px 22px 4px;display:grid;grid-template-columns:1.15fr .85fr;gap:9px;height:118px;}
.vshot{position:relative;overflow:hidden;border-radius:16px;background:var(--pine);border:1px solid rgba(160,126,60,.28);
  box-shadow:0 9px 22px rgba(20,40,42,.12);animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both;}
.vshot:nth-child(2){animation-delay:.08s;}
.vshot img{width:100%;height:100%;object-fit:cover;filter:saturate(1.08) contrast(1.02);transform:scale(1.04);
  animation:photoBreathe 12s ease-in-out infinite alternate;}
.vshot::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 36%,rgba(23,39,43,.72));}
.vshot b{position:absolute;left:12px;right:12px;bottom:10px;z-index:1;color:#F7F0DA;font-family:Fraunces,serif;
  font-size:15px;line-height:1.05;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.4);}
.quick-flow{margin:12px 22px 4px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.flow-chip{position:relative;min-width:0;text-align:left;border:1px solid rgba(56,86,79,.16);background:rgba(255,253,248,.78);
  border-radius:15px;padding:10px 10px 11px;overflow:hidden;box-shadow:0 8px 20px rgba(20,40,42,.06);
  transform:translateY(8px);opacity:0;animation:flowIn .48s cubic-bezier(.2,.8,.2,1) forwards;}
.flow-chip:nth-child(2){animation-delay:.06s;}
.flow-chip:nth-child(3){animation-delay:.12s;}
.flow-chip::before{content:'';position:absolute;inset:0;background:linear-gradient(125deg,transparent,rgba(211,186,130,.22),transparent);
  transform:translateX(-120%);animation:softSweep 6s ease-in-out infinite;}
.flow-chip .mini{position:relative;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--pine);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.flow-chip .mini .ic{width:16px;height:16px;color:var(--gold);}
.flow-chip small{position:relative;display:block;margin-top:4px;font-size:10.5px;line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.flow-chip:active{transform:scale(.96);}
.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;}
.social-card{display:flex;align-items:center;gap:10px;min-height:54px;border:1px solid var(--line);background:var(--card);border-radius:14px;
  padding:12px;color:var(--pine);text-decoration:none;font-weight:800;font-size:13px;box-shadow:0 7px 18px rgba(20,40,42,.05);}
.social-card .ic{width:19px;height:19px;color:var(--gold);}
.social-card.disabled{opacity:.5;pointer-events:none;}
.book-form{display:grid;gap:10px;margin-top:14px;}
.book-form label{display:grid;gap:5px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);}
.book-form input,.book-form textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 13px;font:inherit;font-size:14px;color:var(--ink);}
.book-form textarea{resize:none;min-height:84px;}
.book-form input:focus,.book-form textarea:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px rgba(56,86,79,.12);}
.book-two{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.book-note{font-size:12px;line-height:1.5;color:var(--muted);margin-top:10px;}
.book-status{font-size:12px;line-height:1.45;color:var(--olive);min-height:18px;}
.cat-mosaic{margin:16px 22px 6px;display:grid;grid-template-columns:1.1fr .9fr;gap:11px;isolation:isolate;}
.cat-card{position:relative;min-height:98px;border-radius:20px;padding:14px;overflow:hidden;text-align:left;color:var(--pine);
  border:1px solid color-mix(in srgb,var(--acc) 36%,rgba(221,210,186,.88));
  background:
    linear-gradient(145deg,color-mix(in srgb,var(--tint) 74%,#FFFDF8),rgba(255,253,248,.95) 58%,color-mix(in srgb,var(--acc) 10%,#FFFDF8)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.34) 0 1px,transparent 1px 18px);
  box-shadow:0 14px 30px rgba(20,40,42,.11),inset 0 1px 0 rgba(255,255,255,.64);
  animation:catCardIn .58s cubic-bezier(.2,.8,.2,1) both;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
.cat-card:nth-child(2){animation-delay:.05s;}
.cat-card:nth-child(3){animation-delay:.1s;}
.cat-card:nth-child(4){animation-delay:.15s;}
.cat-card:nth-child(5){animation-delay:.2s;}
.cat-card::before{content:'';position:absolute;inset:-42% -30% auto 35%;height:150px;border-radius:999px;
  background:radial-gradient(circle,color-mix(in srgb,var(--acc) 32%,transparent),transparent 66%);animation:catGlow 7s ease-in-out infinite alternate;}
.cat-card::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--acc),rgba(255,255,255,.25),var(--acc));
  background-size:130px 5px;animation:accentRun 5.8s linear infinite;}
.cat-card .art{position:absolute;right:7px;bottom:7px;width:74px;height:74px;display:flex;align-items:center;justify-content:center;opacity:.86;
  border-radius:22px;background:rgba(255,253,248,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.56);}
.cat-card .art img{max-width:66px;max-height:66px;object-fit:contain;filter:drop-shadow(0 9px 12px rgba(20,40,42,.14));animation:tinyFloat 5.5s ease-in-out infinite alternate;}
.cat-card .icwrap{position:relative;z-index:1;width:36px;height:36px;border-radius:13px;background:rgba(255,253,248,.78);display:flex;align-items:center;justify-content:center;margin-bottom:9px;
  box-shadow:0 7px 16px rgba(20,40,42,.08),inset 0 0 0 1px rgba(255,255,255,.62);}
.cat-card .icwrap .ic{width:19px;height:19px;color:var(--acc);}
.cat-card .icwrap .greek-ic{width:26px;height:26px;}
.cat-card b{position:relative;z-index:1;display:block;font-family:Fraunces,serif;font-size:19px;line-height:1.04;text-shadow:0 1px 0 rgba(255,255,255,.45);}
.cat-card span{position:relative;z-index:1;display:block;margin-top:5px;font-size:11px;font-weight:700;color:color-mix(in srgb,var(--acc) 54%,var(--muted));}
.cat-card:first-child{grid-row:span 2;min-height:207px;padding:17px;}
.cat-card:first-child b{font-size:25px;max-width:76%;}
.cat-card:first-child span{font-size:11.5px;}
.cat-card:first-child .art{width:118px;height:118px;right:12px;bottom:13px;border-radius:28px;}
.cat-card:first-child .art img{max-width:108px;max-height:108px;}
.cat-card.no-art b,.cat-card.no-art:first-child b{max-width:100%;}
.cat-card.no-art:first-child{grid-row:auto;min-height:118px;}
.cat-card.no-art .icwrap{width:46px;height:46px;border-radius:15px;}
.cat-card.no-art .icwrap .ic{width:23px;height:23px;}
.cat-card.no-art .icwrap .greek-ic{width:30px;height:30px;}
.cat-card:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(20,40,42,.14),inset 0 1px 0 rgba(255,255,255,.7);}
.cat-card:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 62%,#fff);outline-offset:2px;}
.cat-card:active{transform:scale(.975);}
@keyframes flowIn{to{opacity:1;transform:none;}}
@keyframes softSweep{0%,45%{transform:translateX(-120%);}72%,100%{transform:translateX(130%);}}
@keyframes catCardIn{from{opacity:0;transform:translateY(12px) scale(.97);}to{opacity:1;transform:none;}}
@keyframes catGlow{from{transform:translateX(-8%) scale(.94);opacity:.62;}to{transform:translateX(8%) scale(1.05);opacity:1;}}
@keyframes accentRun{from{background-position:0 0;}to{background-position:130px 0;}}
@keyframes tinyFloat{from{transform:translateY(2px) rotate(-2deg) scale(.98);}to{transform:translateY(-4px) rotate(2deg) scale(1.04);}}
.updates{margin:14px 22px 8px;display:grid;gap:9px;}
.updates:empty{display:none;}
.updates>div:empty{display:none;}
.updates:not(:has(>div:not(:empty))){display:none;}
.updates .announce{margin:0;}

/* ═════════ search ═════════ */
.search{margin:10px 26px 2px;display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
.search svg{width:15px;height:15px;stroke:var(--faint);stroke-width:1.7;fill:none;flex:0 0 auto;}
.search input{flex:1;border:none;background:none;outline:none;font-size:14px;color:var(--ink);}
.search input::placeholder{color:var(--faint);}

/* ═════════ category nav (icons) ═════════ */
.nav{position:sticky;top:0;z-index:20;background:rgba(245,240,227,.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:12px;overflow:hidden;}
.nav::before,.nav::after{content:'';position:absolute;top:0;bottom:0;width:24px;z-index:2;pointer-events:none;}
.nav::before{left:0;background:linear-gradient(90deg,rgba(245,240,227,.98),transparent);}
.nav::after{right:0;background:linear-gradient(270deg,rgba(245,240,227,.98),transparent);}
.nav .row{display:flex;gap:8px;overflow-x:auto;padding:11px 22px;scrollbar-width:none;scroll-snap-type:x proximity;}
.nav .row::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:20px;
  font-size:12.5px;font-weight:600;letter-spacing:.3px;color:var(--muted);background:var(--card);
  border:1px solid var(--line);white-space:nowrap;transition:.16s;scroll-snap-align:start;}
.tab .ic{width:15px;height:15px;color:var(--olive);}
.tab .greek-ic{width:18px;height:18px;filter:drop-shadow(0 1px 1px rgba(23,39,43,.1));}
.tab.on{background:var(--tab-acc,var(--pine));border-color:var(--tab-acc,var(--pine));color:#F3ECD6;
  box-shadow:0 8px 18px color-mix(in srgb,var(--tab-acc,var(--pine)) 28%,transparent);}
.tab.on .ic{color:var(--gold-lt);}
.tab.on .greek-ic{filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));}
.tab:active{transform:scale(.96);}

/* ═════════ notice strip ═════════ */
.strip{margin:16px 26px 0;padding:12px 15px;border-radius:11px;font-size:12.5px;line-height:1.5;
  background:#FBF2DC;border:1px solid #EAD8AE;color:#7A5C22;}
.strip.traditional{background:#E8F0EA;border-color:#C7D8CD;color:#2E5143;}

/* ═════════ intro / info panel (two ways to use it) ═════════ */
.intro{position:relative;margin:16px 22px 0;padding:16px 17px 16px;border-radius:18px;overflow:hidden;
  background:
    linear-gradient(135deg,rgba(232,240,234,.96),rgba(255,253,248,.97) 52%,rgba(251,242,220,.94)),
    repeating-linear-gradient(90deg,rgba(56,86,79,.04) 0 1px,transparent 1px 18px);
  border:1px solid rgba(160,181,165,.55);
  box-shadow:0 10px 24px rgba(20,40,42,.08),inset 0 1px 0 rgba(255,255,255,.68);}
.intro::before{content:'';position:absolute;left:-30%;right:-30%;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--olive),var(--gold),transparent);
  animation:bannerSheen 6s ease-in-out infinite;}
.intro::after{content:'';position:absolute;right:-44px;bottom:-52px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(211,186,130,.22),transparent 68%);pointer-events:none;}
.intro .beta{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:#fff;background:linear-gradient(120deg,var(--olive),var(--pine));border-radius:20px;padding:4px 9px;
  box-shadow:0 7px 15px rgba(56,86,79,.18);}
.intro h3{font-family:Fraunces,serif;font-weight:600;font-size:17px;color:var(--pine);margin:10px 0 5px;line-height:1.15;}
.intro p{font-size:12.8px;line-height:1.55;color:#4a463c;margin:0;}
.intro p b{color:var(--pine);font-weight:600;}
.intro .x{position:absolute;top:11px;right:12px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
  color:var(--muted);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--card);}
.intro .x:active{transform:scale(.9);}
.intro{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both;}

/* festive announcement banner (e.g. σούβλες night) */
.announce{appearance:none;-webkit-appearance:none;display:block;width:auto;text-align:left;border:0;position:relative;margin:16px 22px 0;padding:17px 18px;border-radius:20px;overflow:hidden;cursor:pointer;
  background:linear-gradient(122deg,#4B1D12,#9A3E1E 52%,#D49A45);color:#FFF3E0;
  border:1px solid rgba(255,220,164,.28);
  box-shadow:0 16px 34px rgba(122,46,18,.31),inset 0 1px 0 rgba(255,255,255,.18);animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both;}
.announce::before{content:'';position:absolute;inset:0;background-image:var(--ann-img);background-size:cover;background-position:center;
  opacity:.18;mix-blend-mode:screen;filter:saturate(1.15) contrast(1.05);transform:scale(1.04);animation:kenburns 16s ease-in-out infinite alternate;}
.announce::after{content:'';position:absolute;inset:0;background:
  linear-gradient(115deg,rgba(0,0,0,.2),transparent 56%),
  radial-gradient(130px 130px at 92% -10%,rgba(255,214,150,.42),transparent 70%),
  radial-gradient(90px 90px at 12% 118%,rgba(255,238,214,.18),transparent 70%);pointer-events:none;}
.announce .em{position:absolute;top:11px;right:15px;font-size:31px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));animation:flick 2.4s ease-in-out infinite;}
@keyframes flick{0%,100%{transform:rotate(-4deg) scale(1);}50%{transform:rotate(4deg) scale(1.08);}}
.announce .ttl,.announce .bd{position:relative;z-index:1;}
.announce .ttl{font-family:Fraunces,serif;font-weight:700;font-size:18px;line-height:1.12;color:#FFEFD6;padding-right:38px;text-shadow:0 2px 12px rgba(0,0,0,.24);}
.announce .bd{font-size:12.8px;line-height:1.5;color:rgba(255,238,214,.92);margin-top:5px;max-width:calc(100% - 82px);}

/* permanent kitchen-ticket disclaimer (ΑΑΔΕ) under the cart */
.legal-note{margin-top:12px;padding:11px 13px;border-radius:11px;background:#FBF2DC;border:1px solid #EAD8AE;
  font-size:11.5px;line-height:1.5;color:#7A5C22;}

/* beta reminder inside the cart */
.beta-cart{display:flex;align-items:center;gap:10px;margin:14px 0 2px;padding:11px 13px;border-radius:12px;
  background:rgba(56,86,79,.08);border:1px dashed rgba(56,86,79,.35);font-size:12px;line-height:1.45;color:#3c5a44;}
.beta-cart:empty{display:none;}
.beta-cart .bdot{flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.8px;color:#fff;background:var(--olive);
  border-radius:20px;padding:3px 8px;animation:betapulse 2.2s ease-in-out infinite;}

/* ═════════ animations (rich but tasteful) ═════════ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes kenburns{0%{transform:scale(1.04) translateY(0);}100%{transform:scale(1.16) translateY(-2%);}}
@keyframes heroGlow{from{opacity:.45;transform:translateX(-4%);}to{opacity:.9;transform:translateX(4%);}}
@keyframes pop{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
@keyframes betapulse{0%,100%{box-shadow:0 0 0 0 rgba(56,86,79,.5);}50%{box-shadow:0 0 0 5px rgba(56,86,79,0);}}
@keyframes shimmer{0%{background-position:-120% 0;}100%{background-position:220% 0;}}
@keyframes floatIn{from{opacity:0;transform:translateY(8px) scale(.96);}to{opacity:1;transform:none;}}
@keyframes chipPop{from{opacity:0;transform:translateY(6px) scale(.9);}to{opacity:1;transform:none;}}
@keyframes ribbonDrift{from{background-position:0 0,0 0;}to{background-position:120px 0,0 0;}}
@keyframes photoBreathe{from{transform:scale(1.03) rotate(-.4deg);}to{transform:scale(1.12) rotate(.4deg);}}
@keyframes iconDrift{from{transform:translateY(-50%) rotate(-2deg) scale(.98);}to{transform:translateY(-50%) rotate(2deg) scale(1.04);}}
@keyframes tabSpark{0%,100%{filter:saturate(1);}50%{filter:saturate(1.35) brightness(1.04);}}
@keyframes bannerSheen{0%,48%{transform:translateX(-36%);opacity:.22;}72%{opacity:.9;}100%{transform:translateX(36%);opacity:.22;}}
@keyframes specialSweep{0%,58%{left:-70%;}82%,100%{left:120%;}}
@keyframes headerAura{from{transform:translateX(-8%) rotate(-3deg) scale(.95);opacity:.46;}to{transform:translateX(7%) rotate(3deg) scale(1.08);opacity:.8;}}
@keyframes headerDash{from{background-position:0 0;}to{background-position:150px 0;}}
@keyframes titleRise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}

/* hero slow ken-burns + shimmering gold feature kicker */
.hero .bg{animation:kenburns 18s ease-in-out infinite alternate;}
.hero .kick{background:linear-gradient(90deg,var(--gold-lt),#F7ECC9,var(--gold-lt));background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5.5s linear infinite;}
/* category chapter: icon pops, text floats in */
.sec-h .sic{animation:pop .55s cubic-bezier(.2,.8,.2,1) both;}
.sec-h .sh-txt{animation:floatIn .55s ease .06s both;}
/* dish-sheet chips cascade in */
#dishRem .rem{animation:chipPop .32s ease both;}
#dishRem .rem:nth-child(2){animation-delay:.05s;}
#dishRem .rem:nth-child(3){animation-delay:.1s;}
#dishRem .rem:nth-child(4){animation-delay:.15s;}
/* featured card gets a soft sheen */
.item.feat{position:relative;overflow:hidden;}
.item.feat::after{content:'';position:absolute;top:0;left:0;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
  transform:translateX(-120%);animation:featSheen 6s ease-in-out 1s infinite;pointer-events:none;}
@keyframes featSheen{0%,100%{transform:translateX(-120%);}18%,100%{transform:translateX(220%);}}
@media (prefers-reduced-motion:reduce){
  .hero .bg,.hero .kick,.hero::after,.sec-h,.sec-h::before,.sec-h::after,.sec-h .cat-art,.sec-h .sic,.sec-h .sh-txt,.cat-card,.cat-card::before,.cat-card::after,.cat-card .art img,.intro,.intro::before,.announce,.announce::before,.announce .em,#dishRem .rem,.item.feat::after,.beta-cart .bdot,.vshot,.vshot img{animation:none!important;}
}

/* ═════════ section ═════════ */
.sec{padding:0 26px;scroll-margin-top:60px;}
.sec-h{position:relative;display:grid;grid-template-columns:54px minmax(0,1fr);align-items:center;gap:14px;margin:44px 0 17px;min-height:118px;
  width:100%;max-width:100%;box-sizing:border-box;padding:17px 124px 17px 17px;border-radius:22px;overflow:hidden;color:var(--pine);
  background:
    linear-gradient(112deg,color-mix(in srgb,var(--accbg,var(--line-2)) 84%,#FFFDF8),rgba(255,253,248,.97) 54%,rgba(255,253,248,.42)),
    radial-gradient(170px 100px at 88% 18%,color-mix(in srgb,var(--acc,var(--gold)) 18%,transparent),transparent 72%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.24) 0 1px,transparent 1px 18px);
  border:1px solid color-mix(in srgb,var(--acc,var(--gold)) 38%,var(--line));
  box-shadow:0 16px 34px rgba(20,40,42,.11),inset 0 1px 0 rgba(255,255,255,.65);animation:fadeUp .48s cubic-bezier(.2,.8,.2,1) both;}
.sec-h::before{content:'';position:absolute;right:76px;top:-50px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--acc,var(--gold)) 22%,transparent),transparent 68%);animation:headerAura 7s ease-in-out infinite alternate;pointer-events:none;}
.sec-h::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:
  linear-gradient(90deg,var(--acc,var(--gold)),rgba(255,255,255,.26),var(--acc,var(--gold)));
  background-size:150px 5px;animation:headerDash 5s linear infinite;}
.sec-h .cat-art{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:92px;height:92px;
  display:flex;align-items:center;justify-content:center;border-radius:24px;background:rgba(255,253,248,.5);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);opacity:.86;animation:iconDrift 8s ease-in-out infinite alternate;}
.sec-h .cat-art img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(20,40,42,.12));}
.sec-h .sic{position:relative;z-index:1;width:54px;height:54px;border-radius:16px;background:rgba(255,253,248,.9);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;box-shadow:0 7px 16px rgba(20,40,42,.12),inset 0 0 0 1px rgba(255,255,255,.64);}
.sec-h .sic .ic{width:26px;height:26px;color:var(--acc,var(--gold));}
.sec-h .sic .greek-ic{width:42px;height:42px;}
.sec-h .sh-txt{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0;}

  :root{--maxw:100vw;}
  .wrap{max-width:100%;overflow-x:clip;}
  .head,.search,.sec{padding-left:16px;padding-right:16px;}
  .hero,.visual-rail,.quick-flow,.cat-mosaic,.updates,.intro,.announce,.strip{margin-left:16px;margin-right:16px;}
  .hero{padding:20px 18px 18px;border-radius:18px;}
  .hero h2{font-size:24px;line-height:1.08;}
  .hero p{max-width:100%;}
  .quick-flow{grid-template-columns:1fr 1fr;}
  .flow-chip{min-height:62px;}
  .flow-chip .mini,.flow-chip small{white-space:normal;text-overflow:clip;}
  .visual-rail{height:auto;grid-template-columns:1fr 1fr;}
  .vshot{min-height:104px;}
  .cat-mosaic{grid-template-columns:1fr 1fr;}
  .cat-card{min-width:0;}
  .cat-card b{max-width:calc(100% - 56px);overflow-wrap:anywhere;}
  .cat-card span{max-width:calc(100% - 56px);}
  .cat-card:first-child b,.cat-card:first-child span{max-width:calc(100% - 86px);}
  .nav .row{padding-left:16px;padding-right:16px;}
  .item .top{grid-template-columns:46px minmax(0,1fr) minmax(12px,.2fr) auto auto;}
  .item .desc{max-width:100%;}
  .item .meta{gap:8px;}
  .info-b,.add-sm{width:38px;height:38px;}
  .sheet{left:0;right:0;transform:translateY(100%);width:100%;max-width:none;border-radius:18px 18px 0 0;padding-left:18px;padding-right:18px;padding-bottom:max(24px,env(safe-area-inset-bottom));}
  .sheet.on{transform:translateY(0);}
  .dsh-photo{margin-left:-18px;margin-right:-18px;}
  .checkout-guide{grid-template-columns:1fr;}
  .checkout-card{grid-template-columns:38px minmax(0,1fr);gap:10px;}
  .checkout-card .arr{display:none;}
  .cart{width:calc(100% - 24px);bottom:max(12px,env(safe-area-inset-bottom));padding:12px 14px;}
  .cart .go{display:none;}
  .cookie{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));}
}
@media(max-width:360px){
  .head .brand h1{font-size:21px;}
  .langbtn{padding:7px 9px;}
  .wifibtn,.carticon{width:34px;height:34px;}
  .hero h2{font-size:22px;}
  .quick-flow,.cat-mosaic,.visual-rail{grid-template-columns:1fr;}
  .cat-card:first-child{min-height:118px;}
  .cat-card b,.cat-card span,.cat-card:first-child b,.cat-card:first-child span{max-width:calc(100% - 82px);}
  .cat-card .art,.cat-card:first-child .art{width:70px;height:70px;right:8px;bottom:8px;}
  .cat-card .art img,.cat-card:first-child .art img{max-width:62px;max-height:62px;}
  .sec-h{padding-right:14px;}
  .sec-h .cat-art{display:none;}
  .item .lead{display:none;}
  .item .top{grid-template-columns:42px minmax(0,1fr) auto auto;}
  .item .pr{font-size:16px;}
  .item .meta{margin-left:44px;}
  .sp-grid,.langgrid,.book-two,.social-grid{grid-template-columns:1fr;}
}

/* ═══════════════════════════════════════════════════════════════════════════
   REFINEMENT LAYER — composition + motion
   A hierarchy · B negative space · C one cohesive palette
   D a choreographed motion system: a different entrance for every section,
     real touch feedback everywhere, two slow ambient touches. Rich, not busy.
   Loaded last, so it settles the styling above it.
   ═══════════════════════════════════════════════════════════════════════════ */

:root{
  --ez-out:cubic-bezier(.16,1,.3,1);         /* soft premium landing */
  --ez-spring:cubic-bezier(.34,1.46,.44,1);  /* slight overshoot     */
  --ez-inout:cubic-bezier(.4,0,.2,1);
}

/* retire the old always-on loops; the new choreography is defined below */
@keyframes headerAura   {from{opacity:0}to{opacity:0}}
@keyframes heroGlow     {from{opacity:0}to{opacity:0}}
@keyframes catGlow      {from{opacity:0}to{opacity:0}}
@keyframes softSweep    {from{opacity:0}to{opacity:0}}
@keyframes bannerSheen  {from{opacity:0}to{opacity:0}}
@keyframes featSheen    {from{opacity:0}to{opacity:0}}
@keyframes headerDash   {from{opacity:1}to{opacity:1}}
@keyframes accentRun    {from{opacity:1}to{opacity:1}}
@keyframes shimmer      {from{background-position:0 0}to{background-position:0 0}}
@keyframes iconDrift    {from{transform:none}to{transform:none}}
@keyframes tinyFloat    {from{transform:none}to{transform:none}}
@keyframes photoBreathe {from{transform:none}to{transform:none}}
.sec-h::before,.hero::after,.cat-card::before,.cat-card::after,
.item.feat::after{display:none!important;animation:none!important;}
/* keyframes that are no longer wired to anything visible */
@keyframes kenburns{from{transform:none}to{transform:none}}
@keyframes betapulse{from{box-shadow:none}to{box-shadow:none}}

/* ═══ C. ONE COHESIVE PALETTE ═════════════════════════════════════════════ */
body::before{display:none!important;}
body{background:var(--paper)!important;}

/* ═══ A+B. CHAPTER HEADERS — typographic, not a gradient slab ═════════════ */
.sec-h{
  background:none!important;border:0!important;
  border-bottom:1px solid var(--line)!important;
  box-shadow:none!important;border-radius:0!important;
  min-height:0!important;padding:0 0 12px 0!important;
  margin:46px 0 6px!important;gap:12px!important;
  grid-template-columns:auto minmax(0,1fr) auto!important;
}
.sec-h .sic{width:34px!important;height:34px!important;border-radius:0!important;
  background:none!important;box-shadow:none!important;}
.sec-h .sic .ic{width:26px!important;height:26px!important;color:var(--olive)!important;}
.sec-h .num{font-family:Inter,sans-serif!important;font-style:normal!important;font-weight:600!important;
  font-size:10px!important;letter-spacing:2.2px!important;color:var(--faint)!important;}
.sec-h .t{font-size:23px!important;font-weight:600!important;color:var(--pine)!important;
  letter-spacing:-.2px!important;}
/* gold rule grows out of the left edge as the chapter arrives */
.sec-h::after{
  content:''!important;position:absolute!important;left:0!important;right:auto!important;
  bottom:-1px!important;height:2px!important;
  background:linear-gradient(90deg,var(--gold),var(--gold-lt))!important;
  width:0!important;transition:width .85s var(--ez-out) .12s!important;animation:none!important;
}
.sec-h.rv::after{width:60px!important;}
.sec-h .cat-art{position:static!important;transform:none!important;
  width:46px!important;height:46px!important;border-radius:0!important;
  background:none!important;box-shadow:none!important;opacity:1!important;}
.sec-h .cat-art img{width:46px!important;height:46px!important;filter:none!important;}

/* ═══ B. NEGATIVE SPACE — dishes breathe, no boxes ════════════════════════ */
.sec{padding:0 24px!important;}
.item{padding:15px 0!important;border-bottom:1px solid var(--line-2)!important;background:none!important;}
.item:last-child{border-bottom:0!important;}
.item .top{gap:14px!important;}
.item .dish-ic{width:46px!important;height:46px!important;background:none!important;border:0!important;
  box-shadow:none!important;border-radius:0!important;overflow:visible!important;}
.item .dish-ic img{width:46px!important;height:46px!important;}
.item .nm{font-size:17px!important;font-weight:500!important;color:var(--ink)!important;line-height:1.25!important;}
.item .desc,.item .meta{margin-left:60px!important;}
.item .desc{font-size:13px!important;color:var(--muted)!important;margin-top:4px!important;max-width:92%!important;}
.item .meta{margin-top:6px!important;}
.item .alg{font-size:11px!important;color:var(--faint)!important;letter-spacing:.2px!important;}
.item.feat{background:none!important;border:0!important;border-bottom:1px solid var(--line-2)!important;
  border-left:2px solid var(--gold)!important;border-radius:0!important;
  padding:15px 0 15px 14px!important;margin:0!important;box-shadow:none!important;}
.item.feat .badge{background:none!important;color:var(--gold)!important;padding:0!important;
  font-size:9.5px!important;letter-spacing:1.4px!important;margin-bottom:6px!important;}

/* ═══ A. HIERARCHY — price is the accent, secondary actions recede ════════ */
.item .pr{font-family:Fraunces,serif!important;font-size:16px!important;font-weight:600!important;color:var(--gold)!important;}
.item .pr .u{color:var(--faint)!important;}
.info-b{border:0!important;background:none!important;color:var(--faint)!important;
  width:26px!important;height:26px!important;font-size:13px!important;}
.add-sm{border-width:1.2px!important;box-shadow:none!important;}

/* ═══ surfaces: flat and calm ═════════════════════════════════════════════ */
.announce{border-radius:16px!important;padding:18px 20px!important;
  box-shadow:0 8px 22px rgba(20,40,42,.13)!important;}
.announce::after{background:linear-gradient(180deg,rgba(20,35,30,.42),rgba(20,35,30,.72))!important;}
.announce .ttl{font-size:17px!important;font-weight:600!important;padding-right:34px!important;text-shadow:none!important;}
.announce .bd{font-size:12.5px!important;color:rgba(255,248,235,.9)!important;}
.strip{background:none!important;border:0!important;border-left:2px solid var(--line)!important;
  border-radius:0!important;color:var(--muted)!important;padding:2px 0 2px 12px!important;
  margin:18px 24px 0!important;font-size:12px!important;}
.head{padding-bottom:10px!important;}
.wifibtn,.carticon,.langbtn{background:var(--card)!important;box-shadow:none!important;
  border:1px solid var(--line)!important;color:var(--pine)!important;}
.nav{background:var(--paper)!important;box-shadow:none!important;border-bottom:1px solid var(--line)!important;}
.tab{background:none!important;border:1px solid var(--line)!important;box-shadow:none!important;font-weight:500!important;}
.tab.on{background:var(--pine)!important;border-color:var(--pine)!important;color:#F3ECD6!important;font-weight:600!important;}
.search{background:var(--card)!important;box-shadow:none!important;border:1px solid var(--line)!important;border-radius:12px!important;}
.cta{background:var(--pine)!important;box-shadow:none!important;}
.sheet{box-shadow:0 -10px 40px rgba(20,40,42,.18)!important;}
.closing .box{background:none!important;border:0!important;border-top:1px solid var(--line)!important;
  border-radius:0!important;padding:14px 0 0!important;}

/* ═══════════════════════════════════════════════════════════════════════════
   D. MOTION SYSTEM
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 1. the header opens the page ───────────────────────────────────────── */
@keyframes crestIn{0%{opacity:0;transform:scale(.6) rotate(-25deg)}
                   60%{opacity:1;transform:scale(1.06) rotate(4deg)}
                   100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes nameIn {from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes btnPop {from{opacity:0;transform:scale(.5) translateY(-6px)}to{opacity:1;transform:none}}
.head .brand h1{animation:nameIn .6s var(--ez-out) .12s both!important;}
.head .brand .sub{animation:nameIn .6s var(--ez-out) .2s both!important;}
.head #bookBtn  {animation:btnPop .5s var(--ez-spring) .26s both!important;}
.head #socialBtn{animation:btnPop .5s var(--ez-spring) .34s both!important;}
.head #wifiBtn  {animation:btnPop .5s var(--ez-spring) .42s both!important;}
.head .carticon {animation:btnPop .5s var(--ez-spring) .48s both!important;}
.head .langbtn  {animation:btnPop .5s var(--ez-spring) .54s both!important;}

/* ── 2. announcement: text rises, photo drifts slowly (ambient #1) ──────── */
@keyframes annIn   {from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes annTxt  {from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slowDrift{0%{transform:scale(1.06)}100%{transform:scale(1.13) translate3d(-1.4%,-1.1%,0)}}
@keyframes emberIn {0%{opacity:0;transform:scale(.4) rotate(-20deg)}100%{opacity:1;transform:none}}
@keyframes emberSway{0%{transform:rotate(-5deg) scale(1)}100%{transform:rotate(5deg) scale(1.07)}}
.announce{animation:annIn .8s var(--ez-out) both!important;}
.announce::before{animation:slowDrift 34s ease-in-out infinite alternate!important;}
.announce .ttl{animation:annTxt .7s var(--ez-out) .16s both!important;}
.announce .bd {animation:annTxt .7s var(--ez-out) .26s both!important;}
.announce .em{display:block!important;
  animation:emberIn .6s var(--ez-spring) .4s both,
            emberSway 3.4s ease-in-out 1s infinite alternate!important;}

/* ── 3. search + notice ─────────────────────────────────────────────────── */
@keyframes fieldIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.search{animation:fieldIn .6s var(--ez-out) .3s both!important;
  transition:border-color .25s var(--ez-inout),box-shadow .25s var(--ez-inout)!important;}
.search:focus-within{border-color:var(--olive)!important;box-shadow:0 0 0 3px rgba(56,86,79,.12)!important;}
.strip{animation:fieldIn .6s var(--ez-out) .38s both!important;}

/* ── 4. category tabs: pop in one by one, icon nudges when selected ─────── */
@keyframes tabIn{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
@keyframes iconNudge{0%{transform:scale(1)}45%{transform:scale(1.22) rotate(-8deg)}100%{transform:scale(1)}}
.nav .tab{animation:tabIn .45s var(--ez-spring) both!important;
  transition:background .3s var(--ez-inout),color .3s var(--ez-inout),
             border-color .3s var(--ez-inout),transform .16s var(--ez-out)!important;}
.nav .tab:nth-child(1){animation-delay:.40s!important}
.nav .tab:nth-child(2){animation-delay:.46s!important}
.nav .tab:nth-child(3){animation-delay:.52s!important}
.nav .tab:nth-child(4){animation-delay:.58s!important}
.nav .tab:nth-child(5){animation-delay:.64s!important}
.nav .tab:nth-child(6){animation-delay:.70s!important}
.nav .tab:nth-child(n+7){animation-delay:.76s!important}
.tab.on .ic{animation:iconNudge .5s var(--ez-spring)!important;}

/* ── 5. chapter entrances — a DIFFERENT move per category ───────────────── */
@keyframes chFade  {from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes chSlide {from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes chScale {from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes chTilt  {from{opacity:0;transform:rotate(-3.2deg) translateY(16px)}to{opacity:1;transform:none}}
@keyframes chBlur  {from{opacity:0;filter:blur(9px);transform:translateY(12px)}
                    to{opacity:1;filter:blur(0);transform:none}}
@keyframes chClip  {from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes sicIn{0%{opacity:0;transform:scale(.5) rotate(-14deg)}
                 65%{opacity:1;transform:scale(1.12) rotate(5deg)}
                 100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes artIn{0%{opacity:0;transform:translateX(14px) scale(.82) rotate(6deg)}
                 100%{opacity:1;transform:none}}
html.motion-on .sec-h{opacity:0;}
.sec .sec-h.rv          {animation:chClip  .8s  var(--ez-out) both!important;}
.sec.appetizers .sec-h.rv{animation:chFade  .75s var(--ez-out) both!important;}
.sec.salads     .sec-h.rv{animation:chSlide .75s var(--ez-out) both!important;}
.sec.meat       .sec-h.rv{animation:chScale .75s var(--ez-spring) both!important;}
.sec.pizza      .sec-h.rv{animation:chTilt  .8s  var(--ez-spring) both!important;}
.sec.drinks     .sec-h.rv{animation:chBlur  .8s  var(--ez-out) both!important;}
.sec-h.rv .num    {animation:chFade .6s  var(--ez-out) .06s both!important;}
.sec-h.rv .t      {animation:chFade .65s var(--ez-out) .12s both!important;}
.sec-h.rv .sic    {animation:sicIn  .7s  var(--ez-spring) .1s both!important;}
.sec-h.rv .cat-art{animation:artIn  .75s var(--ez-spring) .18s both!important;}

/* ── 6. dish rows: stagger in, plate pops, name & price follow ──────────── */
@keyframes rowIn2 {from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes plateIn{0%{opacity:0;transform:scale(.55) rotate(-12deg)}
                   62%{opacity:1;transform:scale(1.1) rotate(4deg)}
                   100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes nmIn   {from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes priceIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.item{opacity:0;transform:translateY(14px);
  transition:background .25s var(--ez-inout)!important;}
.item.in{animation:rowIn2 .55s var(--ez-out) both!important;opacity:1;transform:none;}
.item.in .dish-ic{animation:plateIn .62s var(--ez-spring) .06s both!important;}
.item.in .nm     {animation:nmIn    .5s  var(--ez-out) .12s both!important;}
.item.in .pr     {animation:priceIn .55s var(--ez-out) .2s  both!important;}
.item.in .desc   {animation:nmIn    .5s  var(--ez-out) .24s both!important;}
.item:active{background:rgba(56,86,79,.05)!important;}
.item .dish-ic img{transition:transform .3s var(--ez-spring)!important;}
.item:active .dish-ic img{transform:scale(1.12) rotate(-5deg)!important;}

/* ── 7. controls: crisp touch response everywhere ───────────────────────── */
.wifibtn,.langbtn,.carticon{transition:transform .18s var(--ez-spring),
  background .22s var(--ez-inout),border-color .22s var(--ez-inout)!important;}
.tab:active,.wifibtn:active,.langbtn:active,.carticon:active{transform:scale(.92)!important;}
.wifibtn:active{background:var(--line-2)!important;}
.info-b{transition:transform .3s var(--ez-spring),color .22s ease!important;}
.info-b:active{transform:rotate(14deg) scale(1.25)!important;color:var(--olive)!important;}
.add-sm{transition:transform .2s var(--ez-spring),background .2s ease,color .2s ease!important;}
.add-sm:active{transform:scale(.84)!important;}
.cta{transition:transform .18s var(--ez-out),filter .2s ease!important;}
.cta:active{transform:scale(.985) translateY(1px)!important;filter:brightness(1.06)!important;}

/* ── 8. sheets: spring up, contents cascade ─────────────────────────────── */
@keyframes sheetChild{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet{transition:transform .48s var(--ez-out)!important;}
.scrim{transition:opacity .38s var(--ez-inout)!important;}
.sheet.on > *{animation:sheetChild .5s var(--ez-out) both;}
.sheet.on > *:nth-child(1){animation-delay:.06s}
.sheet.on > *:nth-child(2){animation-delay:.10s}
.sheet.on > *:nth-child(3){animation-delay:.14s}
.sheet.on > *:nth-child(4){animation-delay:.18s}
.sheet.on > *:nth-child(5){animation-delay:.22s}
.sheet.on > *:nth-child(n+6){animation-delay:.26s}
.sheet .grip{transition:background .25s ease!important;}
.sheet.on .grip{background:var(--faint)!important;}

/* ── 9. toast + closing block ───────────────────────────────────────────── */
.toast{transition:transform .42s var(--ez-spring),opacity .3s ease!important;}
html.motion-on .closing{opacity:0;}
.closing.rv{animation:chFade .8s var(--ez-out) both!important;}
.closing .thanks img{transition:transform .4s var(--ez-spring)!important;}
.closing .thanks img:active{transform:scale(1.08) rotate(-4deg)!important;}

/* ── 10. ambient #2: the crest breathes, slowly and slightly ────────────── */
@keyframes crestBreathe{0%{transform:scale(1)}100%{transform:scale(1.035)}}
.head .mark{animation:crestIn .85s var(--ez-spring) both,
                      crestBreathe 7s ease-in-out 1s infinite alternate!important;}

/* ── late corrections (must win over rules further up) ──────────────────── */
@media(max-width:470px){
  .head .brand h1{font-size:19px!important;line-height:1.14!important;letter-spacing:0!important;}
  .head .brand .sub{display:none!important;}
  .head{padding-top:20px!important;}
}
.item .lead{display:none!important;}
.item .top{grid-template-columns:46px minmax(0,1fr) auto auto!important;gap:13px!important;}
.item .nm{font-size:16.5px!important;}
.item .row-act{margin-left:2px!important;}
@media(max-width:420px){
  .item .top{grid-template-columns:44px minmax(0,1fr) auto auto!important;gap:11px!important;}
  .item .nm{font-size:15.5px!important;}
  .item .desc,.item .meta{margin-left:55px!important;}
  .sec{padding:0 20px!important;}
}

/* ── accessibility: honour reduced-motion completely ────────────────────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;}
  .sec-h,.item,.closing{opacity:1!important;transform:none!important;}
  .sec-h::after{width:60px!important;}
}

/* 2026-07-26 category/search polish */
.search{margin:14px 20px 8px!important;min-height:52px!important;padding:0 16px!important;border-radius:18px!important;background:linear-gradient(180deg,#FFFDF8 0%,#F8F1E5 100%)!important;border:1px solid rgba(211,186,130,.42)!important;box-shadow:0 8px 24px rgba(20,40,42,.07)!important;}
.search svg{width:18px!important;height:18px!important;stroke:var(--olive)!important;}
.search input{font-size:16px!important;line-height:1.3!important;min-width:0!important;}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none!important;appearance:none!important;display:none!important;}
.search input::-ms-clear{display:none!important;width:0!important;height:0!important;}
.search-clear{width:34px!important;height:34px!important;border-radius:999px!important;border:1px solid rgba(211,186,130,.42)!important;background:#FFF8EA!important;color:var(--pine)!important;font-size:22px!important;line-height:1!important;display:flex!important;align-items:center!important;justify-content:center!important;opacity:0!important;pointer-events:none!important;transform:scale(.9)!important;transition:opacity .18s ease,transform .18s ease,background .18s ease!important;flex:0 0 auto!important;}
body.searching .search-clear{opacity:1!important;pointer-events:auto!important;transform:scale(1)!important;}
.search-clear:active{transform:scale(.86)!important;background:#F0E7D1!important;}
.search:focus-within{border-color:var(--gold)!important;box-shadow:0 0 0 4px rgba(160,126,60,.13),0 10px 28px rgba(20,40,42,.08)!important;}

const LIMITS = { qtyPerItem:20, totalItems:60, sendCooldownMs:8000, sendsWindowMs:600000, sendsMax:6,
                 chatMinIntervalMs:1200, chatMax:25, chatMaxLen:200 };
const CART_KEY = k => 'tv_cart_' + k;
const SENDS_KEY = 'tv_sends';
const ORDER_STATUS_PREFIX = 'tv_order_status_';
const clampInt = (n,min,max)=>{ n=Math.floor(Number(n)); if(!isFinite(n))return min; return Math.max(min,Math.min(max,n)); };
const safeLS = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} },
                 set(k,v){ try{localStorage.setItem(k,v);}catch(e){} },
                 del(k){ try{localStorage.removeItem(k);}catch(e){} } };

   { lid, id, qty, removed:[idx…] (into item.removable), note:'' } */

const T = k => (VIEW_UI[lang]&&VIEW_UI[lang][k]) || (VIEW_UI.en&&VIEW_UI.en[k]) || (UI[lang] && UI[lang][k]) || UI.en[k] || k;

const NOTE = k => { const n=(VENUE.notices||{}); const o=n[k]||(k==='allergensGeneral'?n.allergens:null)||{}; return o[lang]||o.en||''; };
const money = n => S.settings.currency + Number(n).toFixed(2);
const unitOf = i => (UNITS[i.unit]||{})[lang] || '';
const priceDisp = i => i.priceText ? i.priceText : (i.price>0 ? money(i.price)+`<span class="u">${unitOf(i)}</span>` : '—');
const isTraditional = () => !!(S.settings&&S.settings.traditionalMenuOnly);
function design(){ return Object.assign({accent:'#38564F',showVisualRail:true,categoryArt:true,motion:'rich',showFeaturedHero:true}, (S.settings&&S.settings.design)||{}); }
const canOrder = () => S.settings.serviceOpen && S.settings.acceptOrders && !isTraditional();
const canAdd = i => !i.hidden && i.available && canOrder() && i.price>0;
const tx = i => {
  const t=(i&&i.t)||{};
  const v=t[lang]||t.en||t.el||{};
  if(typeof v==='string') return { n:v, d:'' };
  return { n:String(v.n||'Νέο πιάτο'), d:String(v.d||'') };
};
const isAuto = () => !(LANGUAGES.find(l=>l.code===lang)||{}).verified;
const catName = c => {
  const t=(c&&c.t)||{};
  const v=t[lang]||t.en||t.el||c.id||'';
  return typeof v==='string' ? v : String(v.n||c.id||'');
};
const orderedCats = () => S.categories.slice().sort((a,b)=>a.order-b.order);

  el:{special:'Ειδικό μενού', full:'Όλος ο κατάλογος'},

function announceText(){ const A=(typeof ANNOUNCE!=='undefined')?ANNOUNCE:null; return (A&&A.t&&(A.t[lang]||A.t.en)) || null; }
function specialMenuIds(){
  const A=(typeof ANNOUNCE!=='undefined')?ANNOUNCE:null;
  const ids=(A&&Array.isArray(A.specialCats)&&A.specialCats.length) ? A.specialCats : (A&&A.targetCat ? [A.targetCat] : []);

/* ═══════════════ persistent cart (line-based) ═══════════════ */
let _lid = 0;
const newLid = () => 'L'+(Date.now().toString(36))+(_lid++);
const itemOf = id => S.menu.find(m=>String(m.id)===String(id));
const priceOf = id => { const i=itemOf(id); return i?i.price:0; };
function loadCart(){
  try{
    const raw = safeLS.get(CART_KEY(tableId)); if(!raw) return;
    const data = JSON.parse(raw);
    if(Array.isArray(data)){                                  /* new format */
      data.forEach(l=>{ const it=itemOf(l.id);
        if(it && !it.hidden && it.available && it.price>0){
          const maxRem=(it.removable||[]).length;
          cart.push({ lid:l.lid||newLid(), id:it.id, qty:clampInt(l.qty,1,LIMITS.qtyPerItem),
                      removed:Array.isArray(l.removed)?l.removed.filter(x=>x>=0&&x<maxRem):[],
                      note:(typeof l.note==='string'?l.note.slice(0,120):'') }); }
      });
    } else if(data && typeof data==='object'){                /* migrate old {id:qty} */
      Object.entries(data).forEach(([id,qt])=>{ const it=itemOf(id);
        if(it && !it.hidden && it.available && it.price>0) cart.push({lid:newLid(),id:it.id,qty:clampInt(qt,1,LIMITS.qtyPerItem),removed:[],note:''}); });
    }
  }catch(e){}
}
function saveCart(){ safeLS.set(CART_KEY(tableId), JSON.stringify(cart)); }
/* a "plain" line = no removals, no note → quick-add merges into it */
const sameConfig = (l,removed,note) =>
  l.note===note && l.removed.length===removed.length && l.removed.every(x=>removed.includes(x));

const HATCH = `<svg class="hatch" viewBox="0 0 400 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs><pattern id="h" width="14" height="14" patternTransform="rotate(24)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-opacity="0.04" stroke-width="6"/></pattern></defs>
  <rect width="400" height="220" fill="url(#h)"/></svg>`;
function renderHero(){
  const slot = document.getElementById('heroSlot');
  if(!slot) return;
  if(q.trim()){ slot.innerHTML=''; return; }
  if(design().showFeaturedHero===false){ slot.innerHTML=''; return; }
  const pick = S.menu.find(i=>!i.hidden && i.cat==='meat' && i.available && i.price>0)
            || S.menu.find(i=>!i.hidden && i.available && i.price>0);
  if(!pick){ slot.innerHTML=''; return; }
  const t = tx(pick);
  const sub = t.d ? esc(t.d) : '';
  const bg = (typeof MEDIA!=='undefined' && MEDIA.hero) ? `<div class="bg" style="background-image:url('${MEDIA.hero}')"></div>` : '';
  slot.innerHTML = `<div class="hero">
    ${bg}<div class="ov"></div>${HATCH}
    <div class="kick">${esc(T('featured'))}</div>
    <h2><span class="hic">${dishIcon(pick)}</span><span>${esc(t.n)}</span></h2>
    ${sub?`<p>${sub}</p>`:''}
    <div class="row">
      <span class="pr">${priceDisp(pick)}</span>
      ${ canAdd(pick) ? `<button class="add" data-add="${pick.id}">${esc(T('add'))} +</button>` : '' }
    </div></div>`;
  slot.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();add(+b.dataset.add,b);});
}
function renderVisualRail(){
  const slot=document.getElementById('visualRail'); if(!slot) return;
  if(q.trim()){ slot.className=''; slot.innerHTML=''; return; }
  const a=(typeof MEDIA!=='undefined' && MEDIA.hero) || '';
  const b=(typeof MEDIA!=='undefined' && (MEDIA.logoFull||MEDIA.logo||MEDIA.hero)) || '';
  if(!a&&!b){ slot.className=''; slot.innerHTML=''; return; }
  slot.className='visual-rail';

function scrollBehavior(){

function stickyNavOffset(){

  const headH=head ? head.getBoundingClientRect().height : 0;

  const guideH=(document.body.classList.contains('guided-view') && guide && guideStyle && /^(sticky|fixed)$/.test(guideStyle.position)) ? guide.getBoundingClientRect().height : 0;

   All on-brand: olive, gold, terracotta, pine, sage, wine — cycled by position. */
const CAT_ACC=[['#38564F','#E7EEEA'],['#A07E3C','#F5EDD8'],['#B4623A','#F6E6DC'],
               ['#2C4A4E','#E4EBEB'],['#6E5A2E','#F0E9D5'],['#8A4B3A','#F4E3DC']];

   no cropped stock photos). Unmapped categories simply show no art. */
function catArt(c){ return (typeof catArtSrc==='function') ? catArtSrc(c) : ''; }
function cleanSearch(s){
  return String(s||'').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/ς/g,'σ')
    .replace(/[^\p{L}\p{N}]+/gu,' ').trim();
}
function searchValue(){
  const el=document.getElementById('q');
  return (el ? el.value : (q||'')).slice(0,40);
}
function itemSearchHaystack(i){
  const names=Object.values(i.t||{}).flatMap(v=>typeof v==='string'?[v]:[v.n,v.d]);
  const ing=i.ing?Object.values(i.ing):[];
  const cat=S.categories.find(c=>c.id===i.cat);
  const cats=cat?Object.values(cat.t||{}):[];
  return cleanSearch([i.id,i.priceText,i.price,unitOf(i),...names,...ing,...cats].join(' '));
}
function matches(i){
  const s=cleanSearch(searchValue());
  if(!s) return true;
  return itemSearchHaystack(i).includes(s);
}
function firstMatchingCategory(){
  return activeMenuCats().find(c=>!c.hidden && S.menu.some(i=>!i.hidden&&i.cat===c.id&&matches(i))); 
}
function syncSearch(force){
  const next=searchValue();
  const searching=!!cleanSearch(next);
  const hasMenuContent=!!document.querySelector('#root .sec, #root .guide-landing');
  const staleEmpty=!searching && (document.body.classList.contains('searching') || !hasMenuContent);
  if(!force && next===q && !staleEmpty) return;
  q=next;
  const first=firstMatchingCategory();
  if(first && (searching || (menuView()!=='guide' && (!activeCat || !document.getElementById('sec-'+activeCat))))) activeCat=first.id;
  document.body.classList.toggle('searching', searching);
  document.body.classList.toggle('guided-view', menuView()==='guide' && !searching);
  document.body.classList.toggle('special-menu', specialMenuActive);
  renderStrip();renderAnnounce();renderViewSwitch();renderTabs();renderList();
}
function clearSearch(ev){

/* staggered reveal */
let revObs;
function revealItems(){
  if(!('IntersectionObserver' in window)){ document.querySelectorAll('.item').forEach(e=>e.classList.add('in')); return; }
  if(revObs) revObs.disconnect();
  revObs=new IntersectionObserver(es=>{es.forEach((e,k)=>{ if(e.isIntersecting){ e.target.style.transitionDelay=Math.min(k,6)*40+'ms'; e.target.classList.add('in'); revObs.unobserve(e.target); } });},{threshold:.06,rootMargin:'0px 0px -4% 0px'});
  document.querySelectorAll('.item:not(.in)').forEach(e=>revObs.observe(e));
}
let spy;
function setupSpy(){
  if(spy) spy.disconnect();
  spy=new IntersectionObserver(es=>{
    if(Date.now()<manualCatUntil) return;
    es.forEach(e=>{if(e.isIntersecting){activeCat=e.target.id.replace('sec-','');setActiveTab();}});

function add(id,btn){

function quickAdd(id,btn){
  const i=itemOf(id); if(!canAdd(i)) return;
  if(count()>=LIMITS.totalItems){ toast(T('tooMany')); return; }
  const line=cart.find(l=>l.id===id && sameConfig(l,[],''));
  if(line) line.qty=clampInt(line.qty+1,1,LIMITS.qtyPerItem);
  else cart.push({lid:newLid(),id,qty:1,removed:[],note:''});
  saveCart();
  if(btn){ btn.classList.add('on'); btn.textContent='✓'; flyToCart(btn); setTimeout(()=>{btn.classList.remove('on'); btn.textContent='+';},520); }
  updateCart(true);

/* add a fully-configured line from the dish sheet */
function addConfigured(id,removed,note,qty,fromEl){
  const i=itemOf(id); if(!canAdd(i)) return;
  qty=clampInt(qty,1,LIMITS.qtyPerItem);
  if(count()+qty>LIMITS.totalItems){ toast(T('tooMany')); return; }
  const line=cart.find(l=>l.id===id && sameConfig(l,removed,note)); /* merge identical config */
  if(line) line.qty=clampInt(line.qty+qty,1,LIMITS.qtyPerItem);
  else cart.push({lid:newLid(),id,qty,removed:removed.slice(),note});
  saveCart(); updateCart(true);
  if(fromEl) flyToCart(fromEl);
}
function flyToCart(from){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) return;

  const d=document.createElement('span'); d.className='flydot';
  d.style.left=(a.left+a.width/2)+'px'; d.style.top=(a.top+a.height/2)+'px';
  document.body.appendChild(d);
  requestAnimationFrame(()=>{ d.style.transform=`translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(.3)`; d.style.opacity='0'; });
  setTimeout(()=>d.remove(),640);
}

/* ═══════════════ send to kitchen (guarded) ═══════════════ */
let sendBusy=false;
function recentSends(){ try{ const a=JSON.parse(safeLS.get(SENDS_KEY)||'[]'); const now=Date.now(); const f=a.filter(t=>now-t<LIMITS.sendsWindowMs); safeLS.set(SENDS_KEY,JSON.stringify(f)); return f; }catch(e){ return []; } }
function hasRealTable(){ return !!(tableId && tableId!=='—'); }
function buildCartOrder(){
  const lines=cart.map(l=>{ const i=itemOf(l.id); if(!(i&&!i.hidden&&i.available&&i.price>0)) return null;
    const maxRem=(i.removable||[]).length;
    return { id:i.id, qty:clampInt(l.qty,1,LIMITS.qtyPerItem),
             removed:(l.removed||[]).filter(x=>x>=0&&x<maxRem),
             note:(typeof l.note==='string'?l.note.slice(0,120):'') }; }).filter(Boolean);
  if(!lines.length) return null;
  const tot=lines.reduce((s,l)=>{const i=S.menu.find(m=>m.id===l.id);return s+(i?i.price:0)*l.qty;},0);
  return { id:'O'+Date.now()+'-'+Math.random().toString(36).slice(2,6), table:hasRealTable()?tableId:'', at:Date.now(), lang, lines, total:tot, status:'new' };
}
function traditionalCheckout(){
  toast(T('traditionalToast'));
  closeSheets();
}
function showWaiterCheckout(){
  const order=buildCartOrder();
  if(!order) return;
  closeSheets();
  showSent(order,{mode:'waiter'});
}
function doSend(){
  if(sendBusy){ toast(T('wait')); return; }
  if(!canOrder()) return;
  if(!hasRealTable()){ toast(T('betaNeedsTable')); return; }
  const order=buildCartOrder();
  if(!order) return;
  if(recentSends().length>=LIMITS.sendsMax){ toast(T('tooMany')); return; }
  S.orders.unshift(order);
  if(S.orders.length>200) S.orders.length=200;
  saveState(S);
  const sends=recentSends(); sends.push(Date.now()); safeLS.set(SENDS_KEY,JSON.stringify(sends));
  pushHist(order);                       /* keep it for the rest of the night */
  cart=[]; saveCart(); closeSheets(); updateCart();
  showSent(order);
  sendBusy=true;
  const btn=document.getElementById('send'); btn.disabled=true;
  setTimeout(()=>{ sendBusy=false; }, LIMITS.sendCooldownMs);
}

function showSent(order,opts={}){
  const waiterMode=opts.mode==='waiter';
  document.getElementById('sentH').textContent=waiterMode?T('waiterQrTitle'):T('sent');
  document.getElementById('ordnoL').textContent=T('orderNo');
  const shortNo=order.id.replace(/[^A-Za-z0-9]/g,'').slice(-5).toUpperCase();
  document.getElementById('ordnoV').textContent='#'+shortNo;
  // table: if a table QR set ?t=, use it; otherwise the WAITER assigns it when he scans
  const hasTable = tableId && tableId!=='—';
  document.getElementById('showWaiterT').textContent = waiterMode ? T('waiterQrSub') : (hasTable ? T('showWaiter') : T('waiterAssigns'));
  document.getElementById('sentDone').textContent=T('done');
  const payload={ v:1, no:shortNo, t:(hasTable?tableId:''), a:order.at, s:order.total,
    l:order.lines.map(l=>{ const o={i:l.id,q:l.qty};
      if(l.removed&&l.removed.length) o.r=l.removed;
      if(l.note) o.n=l.note; return o; }) };
  const statusHash=orderStatusHash(payload);
  setOrderStatus(statusHash,'waiting',{no:shortNo,table:payload.t||''});
  let qrData;
  try{ qrData=handoffUrl(payload); }
  catch(e){ qrData=`TSIGOURA · #${shortNo}`; }   /* fallback */
  document.getElementById('orderQR').innerHTML=qrSVG(qrData,220);
  document.getElementById('orderLines').innerHTML=order.lines.map(l=>{const it=itemOf(l.id); const rm=removedText(it,l.removed);
    return `<div class="ordline"><span>${l.qty}× ${esc(it?tx(it).n:'?')}${rm?`<br><span style="font-size:11px;color:var(--terra)">✕ ${esc(rm)}</span>`:''}${l.note?`<br><span style="font-size:11px;color:var(--muted);font-style:italic">✎ ${esc(l.note)}</span>`:''}</span><span>${money((it?it.price:0)*l.qty)}</span></div>`;}).join('')+
    `<div class="ordline" style="font-family:Fraunces,serif;font-weight:600;border:none"><span>${esc(T('total'))}</span><span>${money(order.total)}</span></div>`;
  document.getElementById('sentDone').onclick=closeSheets;
  watchOrderStatus(document.getElementById('waiterStatus'),statusHash);

/* ─── my orders tonight: keep every sent order, allow adding more later ─── */
const HIST_KEY = k => 'tv_hist_' + k;
const NIGHT_MS = 10*60*60*1000;              /* a "night" window = 10h */
function loadHist(){
  try{ const a=JSON.parse(safeLS.get(HIST_KEY(tableId))||'[]');
       const now=Date.now(); return Array.isArray(a)?a.filter(o=>o&&now-o.at<NIGHT_MS).slice(0,40):[]; }
  catch(e){ return []; }
}
function pushHist(order){ const a=loadHist(); a.unshift(order); safeLS.set(HIST_KEY(tableId), JSON.stringify(a.slice(0,40))); }
function histTotal(){ return loadHist().reduce((s,o)=>s+Number(o.total||0),0); }

function renderHist(){
  const a=loadHist();
  document.getElementById('histEye').textContent=T('table').replace('{t}',esc(tableId));
  document.getElementById('histT').textContent=T('myOrders');
  const body=document.getElementById('histBody');
  if(!a.length){ body.innerHTML=`<div class="empty">${esc(T('noOrders'))}</div>`;
    document.getElementById('histTot').innerHTML=''; }
  else{
    body.innerHTML=a.map(o=>{
      const time=new Date(o.at).toLocaleTimeString(lang==='el'?'el-GR':'en-GB',{hour:'2-digit',minute:'2-digit'});
      const no=String(o.id).replace(/[^A-Za-z0-9]/g,'').slice(-5).toUpperCase();
      const lines=(o.lines||[]).map(l=>{const it=itemOf(l.id); const rm=removedText(it,l.removed);
        return `<div class="ordline"><span>${l.qty}× ${esc(it?tx(it).n:'?')}${rm?`<br><span style="font-size:10.5px;color:var(--terra)">✕ ${esc(rm)}</span>`:''}${l.note?`<br><span style="font-size:10.5px;color:var(--muted);font-style:italic">✎ ${esc(l.note)}</span>`:''}</span><span>${money((it?it.price:0)*l.qty)}</span></div>`;}).join('');
      return `<div class="histcard"><div class="hh"><b>#${no}</b><span>${esc(T('orderAt'))} ${time}</span>
        <span class="ht">${money(o.total)}</span></div>${lines}</div>`;
    }).join('');
    document.getElementById('histTot').innerHTML=`<span>${esc(T('nightTotal'))}</span><span>${money(histTotal())}</span>`;
  }
  document.getElementById('histAdd').textContent=T('addMore');
  document.getElementById('histSave').textContent=T('saveImg');
  document.getElementById('histAdd').onclick=()=>{ closeSheets(); window.scrollTo({top:0,behavior:'smooth'}); };
