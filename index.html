/* Receipt image (canvas → PNG) with everything ordered tonight */
function saveReceiptImage(){
  const a=loadHist(); if(!a.length) return;
  const cv=document.getElementById('rcpCanvas'); const R=2;      /* retina */
  const W=380, pad=24;
  // measure height
  let rows=0; a.forEach(o=>{ rows+=1+(o.lines||[]).length; });
  const H=150+rows*22+a.length*16+120;
  cv.width=W*R; cv.height=H*R; const x=cv.getContext('2d'); x.scale(R,R);
  const PINE='#223539', GOLD='#A07E3C', GOLDL='#B89858', INK='#26231B', MUT='#8B8674', LINE='#E3DBC7';
  x.fillStyle='#F5F0E3'; x.fillRect(0,0,W,H);
  x.fillStyle=PINE; x.fillRect(0,0,W,92);
  x.textAlign='center';
  x.fillStyle=GOLDL; x.font='700 15px Georgia,serif'; x.fillText('TSIGOURA', W/2, 34);
  x.fillStyle='#F3ECD6'; x.font='italic 12px Georgia,serif'; x.fillText('verde  RESORT', W/2, 52);
  x.fillStyle='rgba(243,236,214,.75)'; x.font='11px sans-serif';
  x.fillText(T('table').replace('{t}',tableId)+'  ·  '+new Date().toLocaleDateString(lang==='el'?'el-GR':'en-GB'), W/2, 74);
  x.textAlign='left';
  let y=120;
  x.fillStyle=INK; x.font='600 14px Georgia,serif'; x.fillText(T('myOrders'), pad, y); y+=8;
  x.strokeStyle=LINE; x.beginPath(); x.moveTo(pad,y); x.lineTo(W-pad,y); x.stroke(); y+=18;
  a.slice().reverse().forEach(o=>{
    const time=new Date(o.at).toLocaleTimeString(lang==='el'?'el-GR':'en-GB',{hour:'2-digit',minute:'2-digit'});
    const no=String(o.id).replace(/[^A-Za-z0-9]/g,'').slice(-5).toUpperCase();
    x.fillStyle=GOLD; x.font='600 11px sans-serif'; x.fillText('#'+no+'  ·  '+T('orderAt')+' '+time, pad, y); y+=18;
    (o.lines||[]).forEach(l=>{ const it=S.menu.find(m=>m.id===l.id);
      x.fillStyle=INK; x.font='13px sans-serif';
      const nm=(l.qty+'× '+(it?tx(it).n:'?'));
      x.fillText(nm.length>30?nm.slice(0,29)+'…':nm, pad, y);
      x.textAlign='right'; x.fillStyle=MUT; x.fillText(money((it?it.price:0)*l.qty), W-pad, y); x.textAlign='left';
      y+=20; });
    y+=8;
  });
  x.strokeStyle=LINE; x.beginPath(); x.moveTo(pad,y); x.lineTo(W-pad,y); x.stroke(); y+=24;
  x.fillStyle=PINE; x.font='600 16px Georgia,serif'; x.fillText(T('nightTotal'), pad, y);
  x.textAlign='right'; x.fillStyle=GOLD; x.font='700 18px Georgia,serif'; x.fillText(money(histTotal()), W-pad, y);
  x.textAlign='center'; y+=32;
  x.fillStyle=MUT; x.font='10px sans-serif';
  wrapTxt(x, NOTE('allergensGeneral'), W/2, y, W-2*pad, 13, 3);
  try{
    cv.toBlob(b=>{ if(!b){ toast(T('ask')); return; }
      const url=URL.createObjectURL(b); const a2=document.createElement('a');
      a2.href=url; a2.download='tsigoura-'+tableId+'-'+Date.now()+'.png';
      document.body.appendChild(a2); a2.click(); a2.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000); toast(T('saveImg')+' ✓'); });
  }catch(e){ toast(T('ask')); }
}
function wrapTxt(ctx,text,cx,y,maxw,lh,maxLines){
  const words=String(text).split(' '); let line='', n=0;
  for(const w of words){ const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxw){ ctx.fillText(line,cx,y); y+=lh; line=w; if(++n>=maxLines) return; }
    else line=t; }
  ctx.fillText(line,cx,y);
}

function bub(t,w){const b=document.createElement('div');b.className='bub '+w;b.textContent=t;
  const p=document.getElementById('pbody');p.appendChild(b);p.scrollTop=9e9;}
function answer(s0){
  const s=String(s0).toLowerCase().slice(0,200);
  if(/αλλεργ|allerg|алерг|alerg/i.test(s)) return NOTE('allergensGeneral');
  const pq=s.match(/(\d{1,3})/);
  if(pq && /€|евр|euro|ευρ|под|sub|under|έως/i.test(s)){const lim=parseFloat(pq[1]);
    const hits=S.menu.filter(i=>!i.hidden&&i.available&&i.price>0&&i.price<=lim).map(i=>`• ${tx(i).n} ${money(i.price)}`);return hits.length?hits.slice(0,10).join('\n'):T('ask');}
  const c=S.categories.find(c=>Object.values(c.t).some(v=>s.includes(String(v).toLowerCase())));
  if(c){const hits=S.menu.filter(i=>!i.hidden&&i.cat===c.id&&i.available).map(i=>`• ${tx(i).n} ${i.priceText||money(i.price)+unitOf(i)}`);return hits.length?hits.join('\n'):T('ask');}
  const d=S.menu.find(i=>!i.hidden&&Object.values(i.t).some(v=>v.n&&s.includes(v.n.toLowerCase())));
  if(d) return `${tx(d).n} — ${d.priceText||money(d.price)+unitOf(d)}`+(d.available?'':` (${T('soldOut')})`);
  return T('ask');
}

/* localized "onion, olives" for a line's removed[] */
function removedText(it,removed){
  if(!it||!it.removable||!Array.isArray(removed)||!removed.length) return '';
  return removed.map(ix=>{const r=it.removable[ix]; return r?(r[lang]||r.en):null;}).filter(Boolean).join(', ');
}
function catNameById(cid){ const c=S.categories.find(x=>x.id===cid); return c?catName(c):''; }

let dishState=null;
function openDish(id){
  const i=itemOf(id); if(!i) return;
  const t=tx(i);
  dishState={ id:i.id, removed:new Set(), note:'', qty:1 };
  document.getElementById('dishSheet').classList.toggle('readonly', isTraditional());
  document.getElementById('dishEye').textContent = catNameById(i.cat) || T('customize');
  document.getElementById('dishName').textContent = t.n;
  document.getElementById('dishPrice').innerHTML = priceDisp(i);
  const desc=t.d||'';
  const dd=document.getElementById('dishDesc'); dd.textContent=desc; dd.style.display=desc?'':'none';
  document.getElementById('dishAlg').innerHTML=(i.allergens||[]).map(a=>`<span class="ichip">${esc(ALLERGENS[a][lang]||ALLERGENS[a].en)}</span>`).join('');

  const rb=document.getElementById('dishRemBlock'), rem=document.getElementById('dishRem');
  const noteBlock=document.getElementById('dishNote').closest('.dsh-block');
  const qtyBlock=document.querySelector('.dsh-qty');
  const addBtn=document.getElementById('dishAdd');
  if(isTraditional()){
    rb.style.display='none';
    if(noteBlock) noteBlock.style.display='none';
    if(qtyBlock) qtyBlock.style.display='none';
    addBtn.style.display='none';
  } else {
    if(noteBlock) noteBlock.style.display='';
    if(qtyBlock) qtyBlock.style.display='';
    addBtn.style.display='';
  }
  if(!isTraditional() && (i.removable||[]).length){
    rb.style.display='';
    document.getElementById('dishRemT').textContent=T('removeT');
    document.getElementById('dishRemSub').textContent=T('removeSub');
    rem.innerHTML=i.removable.map((r,ix)=>`<button class="rem" data-rm="${ix}">${esc(r[lang]||r.en)} <span class="x">−</span></button>`).join('');
    rem.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const ix=+b.dataset.rm;
      if(dishState.removed.has(ix)){ dishState.removed.delete(ix); b.classList.remove('off'); b.querySelector('.x').textContent='−'; }
      else{ dishState.removed.add(ix); b.classList.add('off'); b.querySelector('.x').textContent='✕'; }
      syncDishAdd(i); });
  } else rb.style.display='none';

  document.getElementById('dishNoteT').textContent=T('noteT');
  document.getElementById('dishNoteSub').textContent=T('noteSub');
  const nt=document.getElementById('dishNote'); nt.value=''; nt.placeholder=T('notePlaceholder');
  nt.oninput=()=>{ dishState.note=nt.value.slice(0,120); };

  const qEl=document.getElementById('dishQty'); qEl.textContent='1';
  document.getElementById('dishMinus').onclick=()=>{ dishState.qty=Math.max(1,dishState.qty-1); qEl.textContent=dishState.qty; syncDishAdd(i); };
  document.getElementById('dishPlus').onclick=()=>{ dishState.qty=clampInt(dishState.qty+1,1,LIMITS.qtyPerItem); qEl.textContent=dishState.qty; syncDishAdd(i); };

  document.getElementById('dishWarn').textContent=T('allergyWarn');
  addBtn.disabled=!canAdd(i);
  addBtn.onclick=()=>{ if(!canAdd(i))return;
    addConfigured(i.id,[...dishState.removed],dishState.note.trim(),dishState.qty);
    closeSheets(); toast(T('added')); };
  if(!isTraditional()) syncDishAdd(i);
  openSheet('dishSheet');
}
function syncDishAdd(i){
  const removedTxt=[...dishState.removed].map(ix=>(i.removable[ix][lang]||i.removable[ix].en)).join(', ');
  document.getElementById('dishAdd').innerHTML=
    `<span>${esc(T('addToCart'))}${removedTxt?`<span class="sub2">${esc(T('without'))} ${esc(removedTxt)}</span>`:''}</span><span class="amt">${money(i.price*dishState.qty)}</span>`;
}

/* ─── intro / info panel: "just view & order traditionally, or try the beta online order" ─── */
function renderIntro(){
  const slot=document.getElementById('introSlot'); if(!slot) return;
  if(isTraditional() || q.trim() || safeLS.get('tv_intro')){ slot.innerHTML=''; return; }
  slot.innerHTML=`<div class="intro">
    <button class="x" id="introX" aria-label="close">✕</button>
    <span class="beta">✦ ${esc(T('introBadge'))}</span>
    <h3>${esc(T('introT'))}</h3>
    <p>${T('introText')}</p>
  </div>`;

}

/* ─── festive announcement (date-gated, e.g. σούβλες for St. Panteleimon eve) ─── */
function renderAnnounce(){
  const slot=document.getElementById('announceSlot'); if(!slot) return;
  const A=(typeof ANNOUNCE!=='undefined')?ANNOUNCE:null;
  if(q.trim() || !A || !A.on){ slot.innerHTML=''; return; }
  const today=new Date(); today.setHours(0,0,0,0);
  const from=A.from?new Date(A.from+'T00:00:00'):null, to=A.to?new Date(A.to+'T23:59:59'):null;
  if((from && today<from) || (to && today>to)){ slot.innerHTML=''; return; }
  const t=(A.t&&(A.t[lang]||A.t.en))||null; if(!t){ slot.innerHTML=''; return; }
  const img = (typeof MEDIA!=='undefined' && (MEDIA.souvles||MEDIA.hero)) ? `url('${MEDIA.souvles||MEDIA.hero}')` : 'none';
  slot.innerHTML=`<button class="announce" type="button" id="announceGo" data-special-open style="--ann-img:${img}">
    ${A.emoji?`<span class="em">${A.emoji}</span>`:''}
    <div class="ttl">${esc(t.title||'')}</div>
    ${t.body?`<div class="bd">${esc(t.body)}</div>`:''}
  </button>`;
  const go=document.getElementById('announceGo');
  if(go) go.onclick=openSpecialMenu;
}

/* ─── smart QR handoff ───
   Guest scans open a calm confirmation page. Admin/waiter devices that are
   already unlocked on the same domain are redirected to admin.html?o=... */
function payloadUrl(page,param,payload){
  const u=new URL(page, location.href);
  u.search=''; u.hash='';
  u.searchParams.set(param, JSON.stringify(payload));
  return u.href;
}
function handoffUrl(payload){ return payloadUrl('index.html','h',payload); }
function adminOrderUrl(payload){ return payloadUrl('admin.html','o',payload); }
function orderStatusHash(p){
  const l=(p.l||[]).map(x=>{ const o={i:x.i,q:x.q}; if(x.r&&x.r.length)o.r=x.r; if(x.n)o.n=x.n; return o; });
  return btoa(unescape(encodeURIComponent(JSON.stringify({no:p.no||'',a:p.a||0,l,s:p.s||0})))).slice(0,80);
}
function setOrderStatus(hash,state,extra={}){
  try{ safeLS.set(ORDER_STATUS_PREFIX+hash, JSON.stringify(Object.assign({state,at:Date.now()},extra))); }catch(e){}
}
function getOrderStatus(hash){
  try{ return JSON.parse(safeLS.get(ORDER_STATUS_PREFIX+hash)||'null'); }catch(e){ return null; }
}
function statusCopy(st){
  const state=(st&&st.state)||'waiting';
  if(state==='sent') return { cls:'sent', title:T('statusSent'), desc:T('statusSentD') };
  if(state==='assigned') return { cls:'', title:T('statusAssigned'), desc:T('statusAssignedD').replace('{t}', st.table||'—') };
  if(state==='scanned') return { cls:'', title:T('statusScanned'), desc:T('statusScannedD') };
  return { cls:'', title:T('statusWaiting'), desc:T('statusWaitingD') };
}
function renderOrderStatusBox(el,hash){
  if(!el || !hash) return;
  const c=statusCopy(getOrderStatus(hash));
  el.classList.toggle('sent', c.cls==='sent');
  el.innerHTML=`<i></i><span><b>${esc(c.title)}</b>${esc(c.desc)}</span>`;
}
function watchOrderStatus(el,hash){
  renderOrderStatusBox(el,hash);
  let last='';
  const tick=()=>{ const raw=safeLS.get(ORDER_STATUS_PREFIX+hash)||''; if(raw!==last){ last=raw; renderOrderStatusBox(el,hash); } };
  tick();
  const id=setInterval(tick,1600);
  window.addEventListener('storage',e=>{ if(e.key===ORDER_STATUS_PREFIX+hash || e.key===ORDER_STATUS_PREFIX+hash+'_ping') tick(); });
  return id;
}
function normalizeHandoff(raw){
  if(!raw || raw.length>2600) return null;
  let p=null; try{ p=JSON.parse(raw); }catch(e){ return null; }
  if(!p || !Array.isArray(p.l) || !p.l.length || p.l.length>40) return null;
  const lines=[];
  for(const l of p.l){
    const it=itemOf(l.i);
    const q=clampInt(l.q,1,LIMITS.qtyPerItem);
    if(!it || it.hidden || !it.available || it.price<=0) continue;
    const max=(it.removable||[]).length;
    lines.push({ i:it.id, q,
      r:Array.isArray(l.r)?l.r.filter(x=>Number.isInteger(x)&&x>=0&&x<max).slice(0,12):[],
      n:(typeof l.n==='string'?l.n.slice(0,120):'') });
  }
  if(!lines.length) return null;
  return { v:1, no:String(p.no||'').replace(/[^A-Za-z0-9]/g,'').slice(0,8), t:String(p.t||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,8),
    a:Number(p.a)||Date.now(), s:lines.reduce((sum,l)=>sum+priceOf(l.i)*l.q,0), l:lines };
}
function renderHandoffInvalid(menuUrl){
  document.body.innerHTML=`<main class="handoff-page">
    <section class="handoff-card">
      <div class="handoff-top">
        <img class="handoff-mark" src="media/mark.png" alt="Tsigoura Verde Resort">
        <span class="handoff-badge">${esc(T('handoffBadge'))}</span>
        <h1>${esc(T('handoffTitle'))}</h1>
        <p class="handoff-sub">Tsigoura Verde Resort</p>
      </div>
      <div class="handoff-body">
        <div class="handoff-error">${esc(T('handoffInvalid'))}</div>
        <div class="handoff-actions"><a class="handoff-btn primary" href="${menuUrl}">${esc(T('handoffBack'))}</a></div>
      </div>
    </section>
  </main>`;
}
function handleHandoff(){
  const params=new URLSearchParams(location.search);
  const raw=params.get('h') || params.get('handoff');
  if(!raw) return false;
  const menuUrl=new URL('index.html', location.href); menuUrl.search=''; menuUrl.hash='';
  const p=normalizeHandoff(raw);
  if(!p){ renderHandoffInvalid(menuUrl.href); return true; }
  const adminUrl=adminOrderUrl(p);
  const statusHash=orderStatusHash(p);
  if(!getOrderStatus(statusHash)) setOrderStatus(statusHash,'waiting',{no:p.no||'',table:p.t||''});
  if(safeLS.get('tv_admin_ok')==='1'){ location.replace(adminUrl); return true; }
  const orderTime=new Date(p.a).toLocaleTimeString(lang==='el'?'el-GR':'en-GB',{hour:'2-digit',minute:'2-digit'});
  const lines=p.l.map((l,ix)=>{
    const it=itemOf(l.i), rm=removedText(it,l.r), note=l.n, lineTotal=money(priceOf(l.i)*l.q);
    return `<div class="handoff-line" style="animation-delay:${Math.min(ix*0.04,.24)}s">
      <div class="handoff-qty">${l.q}×</div>
      <div>
        <div class="handoff-name">${esc(it?tx(it).n:'—')}</div>
        ${(rm||note)?`<div class="handoff-extra">${rm?`<span class="no">✕ ${esc(T('without'))} ${esc(rm)}</span>`:''}${rm&&note?'<br>':''}${note?`<span>✎ ${esc(note)}</span>`:''}</div>`:''}
      </div>
      <div class="handoff-price">${lineTotal}</div>
    </div>`;
  }).join('');
  document.body.innerHTML=`<main class="handoff-page">
    <section class="handoff-card">
      <div class="handoff-top">
        <img class="handoff-mark" src="media/mark.png" alt="Tsigoura Verde Resort">
        <span class="handoff-badge">${esc(T('handoffBadge'))}</span>
        <h1>${esc(T('handoffTitle'))}</h1>
        <p class="handoff-sub">${esc(T('handoffSub'))}</p>
      </div>
      <div class="handoff-body">
        <div class="handoff-meta">
          <div class="handoff-pill"><span>${esc(T('orderNo'))}</span><b>#${esc(p.no||'—')}</b></div>
          <div class="handoff-pill"><span>${esc(p.t?T('table').replace('{t}',''):T('orderAt'))}</span><b>${esc(p.t||orderTime)}</b></div>
        </div>
        <div class="handoff-lines">${lines}</div>
        <div class="handoff-total"><span>${esc(T('total'))}</span><span>${money(p.s)}</span></div>
        <div class="handoff-waiter">
          <div class="qrwrap">${qrSVG(adminUrl,150)}</div>
          <p>${esc(T('handoffWaiter'))}</p>
        </div>
        <div class="handoff-status" id="handoffStatus"></div>
        <div class="handoff-actions">
          <a class="handoff-btn" href="${menuUrl.href}">${esc(T('handoffBack'))}</a>
          <a class="handoff-btn primary" href="${adminUrl}">${esc(T('handoffStaff'))}</a>
        </div>
      </div>
    </section>
  </main>`;
  watchOrderStatus(document.getElementById('handoffStatus'),statusHash);
  return true;
}

/* ─── scroll reveal: adds .rv to chapter headers + closing as they arrive ───
   html.motion-on is what lets the CSS pre-hide them, so if this script never
   runs the page still renders fully visible. */
(function tvReveal(){
  var root=document.documentElement;
  if(!('IntersectionObserver' in window)) return;          /* no pre-hide, no reveal */
  if(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  root.classList.add('motion-on');
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('rv'); io.unobserve(e.target); }
    });
  },{threshold:.15,rootMargin:'0px 0px -6% 0px'});
  function scan(){
    document.querySelectorAll('.sec-h:not(.rv),.closing:not(.rv)').forEach(function(el){ io.observe(el); });
  }
  scan();
  /* the menu re-renders on language change / search — re-scan after each paint */
  var mo=new MutationObserver(function(){ clearTimeout(scan._t); scan._t=setTimeout(scan,60); });
  var root2=document.getElementById('root');
  if(root2) mo.observe(root2,{childList:true});
  /* safety net: anything still hidden after 2.5s is shown anyway */
  setTimeout(function(){
    document.querySelectorAll('.sec-h:not(.rv),.closing:not(.rv)').forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.top < window.innerHeight*1.6) el.classList.add('rv');
    });
  },2500);
})();
